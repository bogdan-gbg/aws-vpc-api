[project]
name = "vpc-provisioning-api"
version = "0.1.0"
description = "Serverless API that provisions private AWS VPCs with multiple subnets."
requires-python = "==3.14.*"

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
markers = ["e2e: end-to-end tests against the deployed stack (need AWS credentials)"]
addopts = "-m 'not e2e'"
